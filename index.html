<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E2ery Turing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 113, 227, 0.10), transparent 36%),
        #f5f5f7;
      color: #1d1d1f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(860px, 100%);
      padding: clamp(34px, 7vw, 72px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(20px);
    }

    .eyebrow {
      margin-bottom: 16px;
      color: #31506f;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 620px;
      margin: 24px 0 0;
      color: #6e6e73;
      font-size: 1.1rem;
      line-height: 1.75;
    }

    .status {
      display: inline-flex;
      margin-top: 34px;
      padding: 9px 14px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      color: #0066cc;
      background: rgba(0, 113, 227, 0.06);
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">JUST FOR ENTERTAINMENT</div>
    <h1>E2ery Turing</h1>

    <p>
      Have FUN, Dr.<br>
      This is the first public test of my personal website.
    </p>

    <div class="status">Public test online</div>
  </main>
</body>
</html>
